#:schema node_modules/wrangler/config-schema.json
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]
main = "src/index.ts"
name = "subscribe-email"

[vars]
OPEN_ACTION = "opened"
OPEN_USER = "innocces"
SELF_EMAIL = "jiangjiangjiangxi@gmail.com"
TR_SERVE = "https://email-reciever.deno.dev"
# Translation: the keyless google gtx endpoint returned 429 from Cloudflare
# egress on the first live sync — use Workers AI as the primary channel.
# Bigger chunks (4000 vs 1200 chars) also cut subrequests sharply.
TR_PROVIDER = "ai"
# TR_MODEL = "@cf/meta/llama-3.3-70b-instruct-fp8-fast"   # Workers AI model override

# RSS direct-subscription sync (utils/rss.ts), also triggerable via POST /rss
[triggers]
crons = ["0 */6 * * *"]

# deno server (TR_SERVE) is only used for dev-mode file writes, batch replay
# and discord notifications — translation runs on Workers AI (AI binding)
# secrets (set via `wrangler secret put`): REPO_TOKEN, ZHIHU_COOKIE, ENV

# Workers AI — markdown translation (utils/translate.ts), model via TR_MODEL
[ai]
binding = "AI"

# raw email log bucket
[[r2_buckets]]
binding = "LOGGER"
bucket_name = "email-reciever-logger"
