#:schema node_modules/wrangler/config-schema.json
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]
main = "src/index.ts"
name = "subscribe-email"

[vars]
OPEN_ACTION = "opened"
OPEN_USER = "innocces"
SELF_EMAIL = "jiangjiangjiangxi@gmail.com"
TR_SERVE = "https://email-reciever.deno.dev"
# Translation: Workers AI's free neuron allocation was exhausted and the gtx
# endpoint returns 429 from Cloudflare egress. MyMemory is keyless and verified
# to preserve markdown + our code placeholders; it is the primary channel,
# with Workers AI and gtx as fallbacks.
TR_PROVIDER = "mymemory"
MYMEMORY_EMAIL = "jiangjiangjiangxi@gmail.com"
# TR_MODEL = "@cf/meta/llama-3.3-70b-instruct-fp8-fast"   # Workers AI model override
# cron fan-out: syncing every source in one invocation exhausts the free-plan
# subrequest budget, so /rss and scheduled dispatch one source per invocation
# through the SELF service binding declared below.

# RSS direct-subscription sync (utils/rss.ts), also triggerable via POST /rss
[triggers]
# 06h: newest-first sync · 03:15: backfill missing history · 04:45: reconcile existing posts
crons = ["0 */6 * * *", "15 3 * * *", "45 4 * * *"]

# deno server (TR_SERVE) is only used for dev-mode file writes, batch replay
# and discord notifications — translation runs on Workers AI (AI binding)
# secrets (set via `wrangler secret put`): REPO_TOKEN, ZHIHU_COOKIE, ENV

# Workers AI — markdown translation (utils/translate.ts), model via TR_MODEL
[ai]
binding = "AI"

# raw email log bucket
[[r2_buckets]]
binding = "LOGGER"
bucket_name = "email-reciever-logger"

# Self service binding: a worker cannot fetch its own workers.dev URL
# (Cloudflare error 1042). A binding re-enters this worker with a fresh
# subrequest budget for each source during the RSS fan-out.
[[services]]
binding = "SELF"
service = "subscribe-email"
